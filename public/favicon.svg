<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Text Fill Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" /> <!-- Royal Blue -->
      <stop offset="100%" stop-color="#1d4ed8" /> <!-- Deep Blue -->
    </linearGradient>
  </defs>

  <!-- Scaled up and larger bold lettermark "IJ" with blue gradient fill -->
  <text 
    x="256" 
    y="400" 
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
    font-size="440" 
    font-weight="900" 
    fill="url(#textGrad)" 
    text-anchor="middle"
    letter-spacing="-25"
  >IJ</text>
</svg>
